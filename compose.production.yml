x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  frontend:
    image: typescript-web-nuxt:production-local
    ports: !reset []
    logging: *production-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
          pids: 256
        reservations:
          cpus: '0.10'
          memory: 128m
