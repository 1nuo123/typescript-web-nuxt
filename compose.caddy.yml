services:
  frontend:
    environment:
      NUXT_API_BASE_URL: '${NUXT_API_BASE_URL:-http://app:8000}'
      NUXT_PUBLIC_CODEX_WS_BASE_URL: '${NUXT_PUBLIC_CODEX_WS_BASE_URL:-}'
    networks:
      edge:
        aliases:
          - frontend

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:-fastapi-web-edge}
