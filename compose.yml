name: typescript-web-nuxt

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: typescript-web-nuxt:local
    pull_policy: build
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_API_BASE_URL: '${NUXT_API_BASE_URL:-http://host.docker.internal:8000}'
      NUXT_PUBLIC_API_BASE_URL: '${NUXT_PUBLIC_API_BASE_URL:-/api}'
      NUXT_PUBLIC_API_TIMEOUT: '${NUXT_PUBLIC_API_TIMEOUT:-10000}'
      NUXT_PUBLIC_ADMIN_OPS_ENABLED: '${NUXT_PUBLIC_ADMIN_OPS_ENABLED:-false}'
      NUXT_PUBLIC_CODEX_FEATURE_ENABLED: '${NUXT_PUBLIC_CODEX_FEATURE_ENABLED:-true}'
      NUXT_PUBLIC_CODEX_REALTIME_PATH: '${NUXT_PUBLIC_CODEX_REALTIME_PATH:-/codex/events}'
      NUXT_PUBLIC_CODEX_WS_BASE_URL: '${NUXT_PUBLIC_CODEX_WS_BASE_URL:-}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
